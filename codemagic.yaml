workflows:
  # -------------------------------------------------------------------
  # Gorsel dogrulama: Mac'imiz yok, bu yuzden her push'ta simulator'da
  # calistirip ekran goruntusu aliyoruz. Claude bu PNG'leri artifact
  # olarak indirip inceleyip kod duzeltmesi yapiyor.
  # -------------------------------------------------------------------
  simulator-preview:
    name: Simulator Preview (screenshots)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "SandalyeyeOtur"
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Boot simulator
        script: |
          # Sabit cihaz adi ("iPhone 15") Codemagic imajinda BULUNMAYABILIR
          # (Xcode surumune gore mevcut simulator seti degisir). Bu yuzden
          # runtime'da mevcut cihazlardan en yeni iPhone'u seciyoruz ve
          # $CM_ENV ile sonraki adimlara aktariyoruz.
          DEVICE_NAME=$(xcrun simctl list devices available | grep -E "^\s+iPhone" | tail -1 | sed -E 's/^[[:space:]]*//; s/ \(.*//')
          if [ -z "$DEVICE_NAME" ]; then
            echo "Kullanilabilir iPhone simulatoru bulunamadi:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Secilen simulator: $DEVICE_NAME"
          echo "DEVICE_NAME=$DEVICE_NAME" >> $CM_ENV
          xcrun simctl boot "$DEVICE_NAME" || true
          xcrun simctl bootstatus "$DEVICE_NAME" -b
      - name: Build for simulator
        script: |
          xcodebuild -project SandalyeyeOtur.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            -derivedDataPath build \
            build
      - name: Install & launch on simulator
        script: |
          APP_PATH=$(find build -name "*.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$DEVICE_NAME" "$APP_PATH"
          xcrun simctl launch "$DEVICE_NAME" com.miktat55.sitdown
          sleep 6
      - name: Capture menu screenshot
        script: |
          mkdir -p screenshots
          xcrun simctl io "$DEVICE_NAME" screenshot screenshots/01_menu.png
      - name: Launch straight into gameplay and capture
        script: |
          # `-uiTestGameplay` GameViewController'da okunuyor: Splash/Menu'yu
          # atlayip dogrudan GameplayScreen'i acar. Boylece Codemagic'in tek
          # goruntuledigi sey menu degil, gercek oynanis (Miko + sandalye +
          # HUD) da CI ekran goruntusunde dogrulanabiliyor.
          xcrun simctl terminate "$DEVICE_NAME" com.miktat55.sitdown || true
          xcrun simctl launch "$DEVICE_NAME" com.miktat55.sitdown -uiTestGameplay
          sleep 3
          xcrun simctl io "$DEVICE_NAME" screenshot screenshots/02_gameplay_walk.png
          sleep 3
          xcrun simctl io "$DEVICE_NAME" screenshot screenshots/03_gameplay_later.png
    artifacts:
      - screenshots/*.png
      - build/**/*.app

  # -------------------------------------------------------------------
  # TestFlight'a gercek imzali derleme. App Store Connect API anahtari
  # Codemagic panelinde (Teams > Integrations) tanimlanmis olmali.
  # -------------------------------------------------------------------
  release-testflight:
    name: Release to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # "app_store_connect" Codemagic panelindeki gercek entegrasyon adi
      # (Key 432H26DDK5, KibleBul icin kurulmustu, Team Key oldugu icin
      # bu uygulama icin de calisir).
      app_store_connect: app_store_connect
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "SandalyeyeOtur"
        BUNDLE_ID: "com.miktat55.sitdown"
        # App Store Connect'teki SAYISAL Apple ID (appstoreconnect.apple.com/apps/<bu>/...).
        # get-latest-testflight-build-number bundle ID'yi KABUL ETMEZ, 404 doner.
        APP_STORE_APPLE_ID: "6809317957"
        ADMOB_APP_ID: $ADMOB_APP_ID_IOS
      groups:
        - appstore_credentials
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Bump build number
        script: |
          # get-latest-*-build-number komutlari BUNDLE ID DEGIL, SAYISAL Apple
          # ID bekler (kanit: onceki denemede bundle ID verilince 404 "no
          # resource of type apps" hatasi -> LATEST sessizce 0'a dustu ->
          # agvtool tekrar "1" yazdi -> Apple "deger zaten kullanildi" dedi).
          # TestFlight'a hic App Store surumu gonderilmedigi icin
          # get-latest-app-store-build-number HER ZAMAN bos doner; asil
          # ihtiyacimiz olan TestFlight build numarasidir.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "SandalyeyeOtur.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
